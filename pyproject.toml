[project]
name = "uestc-electricity-monitor"
version = "0.1.0"
description = "A local UESTC dorm electricity balance monitor."
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45.0",
]

[project.optional-dependencies]
secure = [
  "keyring>=25.0.0",
]

[project.scripts]
uestc-power = "uestc_power.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
